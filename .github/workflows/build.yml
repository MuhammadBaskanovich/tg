name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip if needed
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -q -o "$z"; done || true
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.5 }
      - name: Build
        run: |
          D=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "Project dir: $D"
          gradle -p "$D" assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TGWeb-apk
          path: "**/outputs/apk/debug/app-debug.apk"
